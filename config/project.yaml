# AIGH IP ACMV pipeline: project configuration (reconstructed from the brief, Rev D, 22 Nov 2026).
# Values marked CONFIRM are defaults from Section 11 of the brief, pending Marcus's approval at Gate 0.
project:
  name: AIGH redevelopment, Contract 2, Inpatient (IP) building, ACMV
  brief: AIGH_IP_ACMV_Claude_Code_Prompt.md (Rev D)   # appendices A-E not received; see out/qa/decisions_needed.md
  language: en-GB
  units: {airflow: L/s, pressure: Pa, power: kW, density: W/m2, area: m2, temperature: degC}

drive:
  parent_folder: AH IP Documents
  folders:
    dd_signoff: {id: 18NCSJUCe_M5RZBgFxtPUi2MwWnSaSlaR, role: source, access: read-only}
    template:   {id: 12CQxjaEmdhiJRcZfTT9PWTChwkF_6bJw, role: samples, access: read-only}
    basis:      {id: 16MjqlMneq1h6Zu4IaZ5cRA-HL0H79-zK, role: basis, access: read-only}
    markdown:   {id: 1LM7Days62cbiHH81n31WOPq9AwKKuHK9, role: upload-target, access: write (copy only)}
  rclone_remotes:
    source: {name: aigh_src, scope: drive.readonly}
    markdown: {name: aigh_md, scope: drive, root_folder_id: 1LM7Days62cbiHH81n31WOPq9AwKKuHK9}
  transport: connector      # D-001 decided 22 Nov 2026: connector only; files up to 10 MB; RLS and RDS first; nothing over 10 MB pursued
  exclude: ["*.zip"]
  listing_interval_minutes: 15   # two listings; a changed department is "unstable"

paths:
  source: data/source
  markdown: out/markdown
  sidecar: out/sidecar
  registers: out/registers
  zoning: out/zoning
  loads: out/loads
  schematics: out/schematics
  qa: out/qa
  state: state
  logs: logs

pilot:
  departments: ["30 - Pharmacy", "26 - Diagnostic Imaging", "42 - Data Centre"]   # change if the inventory shows better matches
  schematic_sheet: IP-BH-05010
  gold_set_size: 60
  bluebeam_rooms: 10

precedence:   # Section 11 item 2, CONFIRM
  stages: [DD Closure, AH sign off with comments, Submitted]
  within_stage: latest dated revision
  rfi_overrides_booklet: true
  zoning_source: later dated document governs; every difference listed
  mot_nsc: latest corrigendum governs
  rfi_overrides:   # later RFI responses override for the area they cover (Section 11 item 2)
    - rfi: RFI-ME-0233 (Beca memo V1, 5 Nov 2026)
      scope: 16 DI units of memo Table 1 (L4 Diagnostic Imaging)
      rule: air-side schematics (Corr 5) and the RFI-ME-0233 zoning govern tags, zoning, airflows and AHU levels over SCH005
      crossref: out/registers/tag_crossref_rfi_me_0233.csv
      extend_to_all_departments: false   # D-006 decided: DI only; elsewhere schedule and schematics should agree, differences listed
  stray_folders: {governs: "29 - Lab", compare_by_hash: ["__29 - Lab", "__29 - Lab"]}

chilled_water:   # RFI-ME-0233 memo s1, s4; PS ACMV Corr 7 PS/10 (cited by the memo)
  normal: {supply_c: 8.0, return_c: 16.0, applies_to: all PAHUs, AHUs and FCUs}
  low_temperature: {supply_c: 5.0, return_c: 13.0, applies_to: "AHU-B-B1-B2PHAB-01A/B, -02A/B, -03A/B, -04 (Basement 2 Compounding Pharmacy) only"}
  duty_standby_configuration_b: 2N (PS Appendix F p.222)

tolerances:
  area_vs_soa: {agree_pct: 3, agree_m2: 0.5, minor_pct: 10}
  method_a_vs_b: {pct: 2, m2: 0.3, min_share: 0.95}
  gold_bluebeam: {pct: 1, m2: 0.2}
  calibration: {residual_mm: 50, scale_pct: 0.5, north_deg: 2}
  opening_vs_plan_mm: 100
  vision_glazing_both_share: 0.95
  numeric_recall: 0.995
  zoning_confidence: {min: 0.9, area_share: 0.98, majority_share: 0.80}
  recompute_pct: 0.5
  balance: {pct: 1, lps: 10}
  known_answer_m3h: 0.2

defaults_to_confirm:   # Section 11, every value CONFIRM
  duct_leakage_pct: 10   # CONFIRMED by Marcus 22 Nov 2026: 10 % default; the 15 % stated on the air-side schematics (IP-BH-05010 note 9/10) is a recorded difference, not adopted
  outdoor_air_rule: {max_share_of_ahu_supply_pct: 5, min_fraction_drop_pp: 5}
  schematic_update_rule: {increase_pct: 5, increase_lps: 10, reduce_without_approval: false}
  area_used: measured_when_outside_tolerance   # alternative: larger_of_two
  occupancy_fallback_table: "SS 553:2016 Table 2 (as the Rev A example used)"
  second_measurement_method: SAM   # fallback: region_growing (SAM weight hosts are blocked here, D-004)
  zoning_granularity: one merged zone per AHU per storey; duty/standby pair is one zone

pressure_method:   # Section 8.3, Marcus's method
  airtightness_m3h_per_m2_at_50pa: 2.5
  tighter_room_m3h_per_m2_at_50pa: 1.0
  flow_exponent: {n: 0.65, range: [0.50, 0.75]}
  discharge_coefficient: 0.6
  air_density_kg_m3: 1.2
  reference_space_pa: 0
  applies_at_or_beyond_pa: 5
  door_gap_cm2: {hinged_sealed: 15, sliding_sealed: 10, bed_width_sealed: 20, shaft_access_sealed: 10}
  unsealed_gap_mm: {sides_top: 3, bottom: 10}
  ratio: {fail_below: 1.0, verify_below: 1.2}

workbook:
  fonts: {body: Arial, mono: Consolas}
  sizes: {title: 18, section: 12, header: 10, body: 10, note: 8}
  file_name: "AIGH_C2_D{nn}_{Department}_Thermal_Load_Calc_RevA.xlsx"
  common_areas_file: AIGH_C2_D00_Common_Areas_Thermal_Load_Calc_RevA.xlsx
  master_summary: AHU_master_summary.xlsx
  print: {paper: A3, orientation: landscape}
  # Revision block of every department workbook (README By, Chk'd, App'd; file author). Left blank until given: never invented.
  people: {author: "", checked_by: "", approved_by: ""}
  banned_functions: [XLOOKUP, FILTER, UNIQUE, SORT, SEQUENCE]

zoning:
  background_revision: latest available corrigendum per sheet   # Marcus 22 Nov 2026
  zone_lower_basement_3: true
  mezzanines: per the stacking diagram
  output: out/zoning/AIGH_IP_AHU_Zoning_Consolidated.pdf
  fill_opacity: 0.35
  reserved_colour: pure red (review mark-ups only)
  rooms_layer: "Rooms (measured)"

models:   # baseline tiers, Section 4.2; the allocation specialist confirms from measurements
  scripts: no model
  tile_reader: {model: haiku, effort: low}
  pipeline_code: {model: sonnet, effort: high}
  dept_extractor: {model: sonnet, effort: medium}
  workbook_builder: {model: sonnet, effort: medium}
  acmv_engineer: {model: opus, effort: high}
  envelope_analyst: {model: opus, effort: xhigh}
  schematic_engineer: {model: opus, effort: high}
  verifier: {model: opus, effort: high}
  council: {model: opus, effort: xhigh}
  chair: {model: opus, effort: high}   # Marcus 22 Nov 2026: main session on Opus 5.5; Fable not used for any stage
  drive_listing: {model: haiku, effort: low}
  connector_pull: {model: sonnet, effort: low}
  rule: every agent call names its model; none inherits the session model

# D-008 (Marcus, 2026-11-22): department folders processed for RDS and SOA only.
department_scope:
  process: [RDS, SOA]
  also_processed: [short_dd_booklets, basis]
  not_processed: [RLS, SoE, medical_equipment_list, records_of_engagement, dwg_list, other]

# Marcus, 22 Nov 2026: final verification before delivery by Fable 5.2; fixes by Sonnet (code, extraction) and Opus (adjudication).
final_verification:
  verifier: fable
  verifier_effort: medium  # D-046
  # D-045: Fable 5.2 only for the last session (final verification and debrief); no intermediate Fable runs
  fixers: [sonnet, opus]
# D-014: before the final verification, two reviewer roles on each workbook batch, fixes by sonnet.
pre_verification_review:
  reviewers:
    - {role: Senior Graphic Designer, focus: [typography, hierarchy, colour and cell code, print proof], model: opus}
    - {role: Advanced Excel user, focus: [live formulas and precedents, named ranges, allowed functions, information flow, D-013 columns], model: opus}
  fixer: sonnet

# D-011 (Marcus, 22 Nov 2026): App D units recalculated from area; default for circulation/corridor/lobby spaces
# without a booklet row = modal booklet circulation row (ASSUMPTION, to confirm).
circulation_default_criteria:
  pressure: neutral
  min_oa_ach: 2
  min_total_ach: 6
  air_class: 2
  filter: MERV 15
  rh_max_pct: 60
  temp_c: [23, 25]
  source: "modal of 45 corridor/circulation/lobby rows in out/registers/criteria.csv"
  status: ASSUMPTION

# D-012 (Marcus, 22 Nov 2026): schedule and schematic airflows are oversized; comparison only.
airflow_comparison:
  schedule_and_schematic_role: information_only   # never a target or cap
  calc_below_reference: report_reduction          # not a failure
  calc_above_reference: flag_VERIFY
  attribute_reduction_to: [area_basis, criteria_ach_or_thermal, duct_leakage_10_vs_15, oa_rule]
  # D-013: every equipment row carries Tender airflow (original, with source), Calculated, Reduction L/s, Reduction %, Remarks.
  equipment_columns: [tender_airflow_L_s, tender_source, calculated_airflow_L_s, reduction_L_s, reduction_pct, remarks]
  tender_source_order: [equipment_schedule_corr5, mot_nsc_equipment_schedule_corr2, tender_airside_schematic]   # MOT NSC units: Overall AC Equipment Schedule (Corr 2) or the IP-BH-16xxx tender schematics

# D-015 (Marcus, 22 Nov 2026): deliverable language.
deliverable_language:
  standard: ASD-STE100
  spelling: British
  forbidden_terms: [Claude, Anthropic, AI, model, agent, subagent, workflow, council, gate, pipeline, "method A", "method B", register, LLM, Fable, Opus, Sonnet, Haiku, prompt, script, MarkItDown]
  text_gates: [ste-lint-gate, humanizer, remove-ai-marks]
  cite_sources_as: "document, issue, sheet/page"

# D-016 (Marcus, 22 Nov 2026): occupancy (number of people) from the RDS first, then booklet, then density default (flagged).
occupancy:
  source_order: [rds, density_default]   # D-018: ASHRAE default only where the RDS occupancy field is empty
  rds_register: out/registers/rds_rooms.csv
  reading_rule: "sum of upper bounds of patients + staff + visitors as printed; n/a or 0 -> 0 (an RDS value, not empty); blank or no RDS for the room -> density_default"
  rule_status: ASSUMPTION

# D-017 (Marcus, 22 Nov 2026): occupancy fallback (no RDS, no booklet) = area x default density by room use.
# Values per 100 m2: ASHRAE 62.1 Table 6.2.2.1 default occupant density (health-care rows: ASHRAE 62.1-2007).
# All values VERIFY against the issued standard (edition to confirm). Cell text red, note in Remarks.
  density_default:
    style: {font_colour: "FFC00000", named_style: Assumption-Occupancy, code: A}
    remarks_template: "Occupancy assumed: {density} persons / 100 m² × {area} m². Number of persons: {people} (ASHRAE 62.1 Table 6.2.2.1, {use}). No RDS value. To confirm."
    rounding: up_to_whole_person
    per_100m2:
      office: 5
      reception_waiting: 30
      conference_meeting: 50
      main_entry_lobby: 10
      break_room_pantry: 25
      lecture_classroom: 65
      lecture_hall_fixed_seats: 150
      classroom_training: 35
      computer_lab: 25
      laboratory: 25
      process_area: 7      # light industrial (ASHRAE 62.1 Table 6.2.2.1); decontamination, washing, inspection and packing rooms of the CSSD; fix 2, VERIFY
      pharmacy_prep: 10
      retail_sales: 15
      kitchen_cooking: 20
      cafeteria_dining: 100
      telephone_data_entry: 60
      patient_room: 10
      medical_procedure: 20
      operating_room: 20
      recovery_icu: 20
      physical_therapy: 20
      corridor_circulation: 0
      storage: 0
      toilet: 0
      plant_room: 0
    status: VERIFY

# D-019 (Marcus, 22 Nov 2026): ceiling height from the RLS only (narrow exception to D-008), per room type; else flagged default.
ceiling_height:
  source_order: [rls, flagged_default]
  rls_pattern: "CH\\s*=\\s*(\\d{4})"
  flagged_default_m: 3.0

# D-025 (Marcus, 23 Nov 2026): plug load from ASHRAE where no project value; lighting by the same rule (flagged).
# W/m2 by room use. Plug: ASHRAE Handbook Fundamentals plug-load densities; lighting: ASHRAE 90.1 space-by-space LPD.
# All values VERIFY against the issued editions. Cells red (as D-017) with a Remarks note.
internal_loads:
  style: {font_colour: "FFC00000", named_style: Assumption-Load, code: A}
  remarks_template: "{what} assumed: {value} W/m2 (ASHRAE, {use}). No project value. To confirm."
  equipment: {value: 0, flag: VERIFY, note: "SoE not processed (D-008); equipment-led rooms flagged"}
  envelope: not_assessed
  status: VERIFY
  plug_w_m2:      {office: 10.8, meeting: 5.4, reception_waiting: 5.4, lobby: 2.0, corridor_circulation: 1.0, patient_room: 10.0, icu_hdu_bed: 15.0, exam_treatment: 15.0, operating_room: 20.0, recovery: 15.0, procedure_imaging: 20.0, nurse_station: 10.8, pharmacy: 15.0, laboratory: 20.0, break_room_pantry: 10.8, training_classroom: 10.8, computer_lab: 20.0, store: 1.0, toilet: 0.0, plant_room: 0.0, kitchen: 20.0, dining: 5.4, workshop: 15.0}
  lighting_w_m2:  {office: 8.0, meeting: 10.4, reception_waiting: 9.0, lobby: 9.0, corridor_circulation: 9.9, patient_room: 6.7, icu_hdu_bed: 6.7, exam_treatment: 18.1, operating_room: 24.3, recovery: 12.4, procedure_imaging: 11.4, nurse_station: 8.1, pharmacy: 17.8, laboratory: 14.3, break_room_pantry: 6.4, training_classroom: 10.0, computer_lab: 10.0, store: 4.1, toilet: 6.8, plant_room: 4.6, kitchen: 11.7, dining: 4.3, workshop: 12.0}

# D-026: presumed criteria from the same space in another department.
presumed_criteria:
  style: {font_italic: true, font_colour: "FF00B050", named_style: Presumed-Criteria, code: A}
  remarks_template: "Presumed criteria: taken from {department} booklet p{page}, {row}. No row in this department. To confirm."
  match_order: [same_room_type_code, same_name, same_use_class]

# D-027: reduction stated only where Calculated < Tender and the unit's rooms are complete; otherwise silent.
# D-028: pressure offsets from 2.5 m3/h.m2 @ 50 Pa on internal surface (doors included), n = 0.65; no door data.
pressure_method_d028: {airtightness_m3h_m2_50pa: 2.5, n: 0.65, sensitivity_n: [0.50, 0.75], door_gaps: not_modelled}

# D-029 (Marcus, 23 Nov 2026): every electrical room (ELEC, LV, HV, switch rooms) is on duty/standby FCUs.
electrical_rooms:
  name_pattern: "\\b(ELEC|ELECT|ELECTRICAL|LV|HV|SWITCH|SWITCHRM|ESR|MSB)\\b"
  class: FCU_duty_standby
  tag_source_order: [equipment_schedule_corr5, airside_schematic, "FCU duty/standby (tag to confirm)"]
  list_changes_from: [plan_mode_label, earlier_assignment]

# D-030..D-033 (Marcus, 23 Nov 2026)
supply_floor_from_exhaust: none_without_pressure_offset      # D-030
single_pass_rule:                                             # D-031
  sets_ahu_oa_fraction_when: "100 % OA required for clean/sterile supply (single pass Y with air class 1 or HEPA, isolation, protective, theatre, or specified)"
  dirty_rooms: {supply: recirculated_from_department_ahu, exhaust: dedicated, return: none, sets_fraction: false}
  classification_status: ASSUMPTION
ahu_balance: per_room_then_ahu                                # D-032: OA, recirculated, spill, supply adjusted at AHU
oa_per_area_or_person_is_supply_floor: true                   # D-033

# D-034..D-044 (Marcus, 23 Nov 2026)
ceiling_height_two_values: highest                         # D-035 (replaces most-frequent/lowest)
hfds:                                                      # D-036, D-037
  file: "data/source/Basis/HFDS (uploaded)/HFDS - Mechanical reverse-brief.pdf"
  use_for: [plant_rooms, comms_riser_rooms, it_lan_ups_battery_rooms, innovation_lab, rooms_with_no_use_mapped, b1_r001_ahu_deck]
  it_lan_ups_battery_class: FCU
  ahu_plant_rooms: spill_air_from_ahu_supply
mot:                                                       # D-038, D-039
  tag_authority: ["Short Version DD Booklet/AHU Cross Verification - MOT NSC Register.xlsx", MOT NSC]
  ot_airflow: "sum(HEPA terminal face area x required face velocity) x (1 + duct leakage)"
  hepa_schedule: MOT NSC HEPA module schedule (latest corrigendum)
  face_velocity_source: "3. AH MOT NSC - Tech Specs for ACMV Services (Corri 3).pdf"
zoning_d040: {governing: dd_booklet_ahu_zoning, markups: unflattened_polygons_colour_coded, other_evidence: fills_gaps_only}
grid_typical_spacing_mm: 8400                              # D-041
envelope: {source: "Short Version DD Booklet/20260129_AIGH_ETTV_Report.pdf", status: to_assess_before_issue}   # D-042
equipment_provisional_w_m2: {allowed: true, style: Assumption-Load, flag: vendor data}                       # D-043
common_areas_lb3_to_l01: build                             # D-044
# D-048: booklet zoning by room list (booklet rooms -> SOA/DPA -> plan room polygons); picture registration = cross-check only
zoning_d048: {root: dd_booklet_room_list, locate_via: [soa_rooms, dpa_rooms, room_polygons], zone_polygon: union_of_located_rooms, picture_registration: cross_check_only}
